backend = "xrender";
vsync = true;
use-damage = true;

# Picom versions before 12 do not support animation scripts. Use lightweight
# open/close fading as a compatible fallback.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
no-fading-openclose = false;

shadow = true;
shadow-radius = 10;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.12;

corner-radius = 10;
detect-rounded-corners = true;
detect-client-opacity = true;
