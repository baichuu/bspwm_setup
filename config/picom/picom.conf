backend = "xrender";
vsync = true;
use-damage = true;

# Basic fallback fading for menus and other unmanaged surfaces.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
no-fading-openclose = false;

shadow = true;
shadow-radius = 10;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.12;

corner-radius = 10;
detect-rounded-corners = true;
detect-client-opacity = true;

# Keep one animation rule only: normal windows use the same open, close, and
# geometry transitions as the current workstation configuration.
rules = (
  {
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.4;
        opacity = {
          duration = 0.1;
          start = "window-raw-opacity-before";
          end = 0;
        };
      },
      {
        triggers = ["open", "show"];
        opacity = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = 0;
          end = "window-raw-opacity";
        };
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        scale-x = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = 0;
          end = 1;
        };
        scale-y = "scale-x";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      },
      {
        triggers = ["geometry"];
        scale-x = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = "window-width-before / window-width";
          end = 1;
        };
        scale-y = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = "window-height-before / window-height";
          end = 1;
        };
        offset-x = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = "window-x-before - window-x";
          end = 0;
        };
        offset-y = {
          curve = "cubic-bezier(0.3,1.0,0.4,1)";
          duration = 0.2;
          start = "window-y-before - window-y";
          end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
      }
    );
  }
);
